<!DOCTYPE html>
<html>
<head>
    <title>Pro-ai Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { background:#0a0a0a; color:#fff; font-family:Arial; margin:0; }
        .navbar { background:#111; padding:15px; display:flex; align-items:center; border-bottom:1px solid #333; }
        .navbar a { color:#FFD700; margin-left:auto; text-decoration:none; }
        .chat-container { max-width:800px; margin:20px auto; padding:10px; }
        .message { padding:12px 16px; margin:10px 0; border-radius:10px; max-width:70%; }
        .user-message { background:#FFD700; color:#000; margin-left:auto; }
        .ai-message { background:#222; display:flex; align-items:flex-start; gap:8px; }
        .ai-avatar { height:20px; width:20px; border-radius:50%; margin-top:3px; flex-shrink:0; }
        input, button { padding:10px; border-radius:5px; border:none; }
        input { width:75%; background:#222; color:#fff; }
        button { background:#FFD700; color:#000; font-weight:bold; cursor:pointer; }
    </style>
</head>
<body>
    <div class="navbar">
        <img src="/static/logo.png" height="40" style="margin-right:10px;">
        <span style="font-weight:bold; color:#FFD700;">Pro-ai</span>
        <a href="/logout">Logout</a>
    </div>

    <div class="chat-container">
        {% for msg in messages %}
            {% if msg.role == 'user' %}
                <div class="message user-message">
                    {{ msg.content }}
                </div>
            {% else %}
                <div class="message ai-message">
                    <img src="/static/logo.png" class="ai-avatar">
                    <span>{{ msg.content }}</span>
                </div>
            {% endif %}
        {% endfor %}

        <form method="POST" style="margin-top:20px;">
            <input name="prompt" placeholder="Ask Pro-ai anything..." required>
            <button type="submit">Send</button>
        </form>
    </div>
</body>
</html>
