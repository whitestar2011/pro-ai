<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pro AI Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="background:#111; color:white; margin:0; font-family:Arial;">
  
  <!-- HEADER -->
  <header style="display:flex; justify-content:space-between; align-items:center; padding:15px 20px; border-bottom:2px solid #FFD700; background:#000;">
    <img src="/static/logo.svg" height="40">
    <div style="position:relative;">
      <button onclick="toggleMenu()" style="font-size:24px; background:none; border:none; color:#FFD700; cursor:pointer;">⋮</button>
      
      <!-- KEBAB MENU -->
      <div id="menu" style="display:none; position:absolute; right:0; top:40px; background:#000; padding:10px; border:1px solid #FFD700; border-radius:8px; width:200px;">
        <!-- SHARE BUTTON -->
        <button id="shareBtn" style="width:100%; padding:12px; background:#2563EB; color:white; border:none; border-radius:8px; font-weight:600; cursor:pointer; margin-bottom:10px;">
          Share
        </button>
        <a href="/logout" style="display:block; padding:12px; color:red; text-decoration:none; text-align:center; border-radius:8px; background:#220000;">Logout</a>
      </div>
    </div>
  </header>

  <!-- MAIN CONTENT -->
  <div style="padding:30px; text-align:center;">
    <h1>Welcome to Pro AI</h1>
    <p>Your AI is ready to use</p>
  </div>

<script>
function toggleMenu(){ 
  let menu = document.getElementById('menu');
  menu.style.display = menu.style.display=='block' ? 'none' : 'block'; 
}

document.getElementById('shareBtn').onclick = async () => {
  const url = 'https://pro-ai-muxb.onrender.com';
  if(navigator.share){ 
    await navigator.share({title: 'Pro AI', text: 'Check out this AI!', url: url}) 
  } else { 
    await navigator.clipboard.writeText(url); 
    alert('Link copied to clipboard!') 
  }
}
</script>
</body>
</html>
