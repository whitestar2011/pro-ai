<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pro AI Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="background:#0a0a0a; color:white; font-family:Arial; margin:0; padding:0;">
  
  <!-- NAVBAR -->
  <div style="display:flex; justify-content:space-between; align-items:center; padding:15px 30px; border-bottom:1px solid #FFD700;">
    <img src="/static/logo.png" height="40" style="margin-right:10px;"><br>
    <div>
      <span style="color:#FFD700; margin-right:20px;">Hi, {{ user }}</span>
      <a href="/logout" style="color:#FFD700; text-decoration:none; border:1px solid #FFD700; padding:8px 15px; border-radius:8px;">Logout</a>
    </div>
  </div>

  <!-- MAIN CONTENT -->
  <div style="text-align:center; padding:60px 20px;">
    <h1 style="color:#FFD700; font-size:32px;">Welcome to Pro AI Dashboard</h1>
    <p style="color:#ccc; font-size:16px;">You are successfully logged in</p>
    
    <!-- AI CHAT BOX PLACEHOLDER -->
    <div style="max-width:700px; margin:40px auto; background:#111; border:2px solid #FFD700; border-radius:16px; padding:30px;">
      <h3 style="color:#FFD700;">Your AI Assistant</h3>
      <p style="color:#aaa;">This is where your chat/AI will go later</p>
    </div>

    <!-- SHARE BUTTON -->
    <button onclick="copyLink()" style="padding:12px 30px; background:#FFD700; color:black; border:none; border-radius:8px; font-weight:bold; cursor:pointer; font-size:16px;">
      Share Pro AI
    </button>
    <p id="copied" style="color:#00ff00; margin-top:10px; display:none;">Link Copied!</p>
  </div>

<script>
function copyLink() {
  navigator.clipboard.writeText("https://pro-ai-muxb.onrender.com");
  document.getElementById("copied").style.display = "block";
  setTimeout(()=> document.getElementById("copied").style.display = "none", 2000);
}
</script>

</body>
</html>
