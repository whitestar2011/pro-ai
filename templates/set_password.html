<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Set Password</title><meta name="viewport" content="width=device-width, initial-scale=1.0"></head>
<body style="display:flex; justify-content:center; align-items:center; height:100vh; background:#111; margin:0; font-family:Arial;">
  <form action="/set_password" method="POST" style="background:#000; padding:40px; border:2px solid #FFD700; border-radius:16px; text-align:center;">
    <h2 style="color:#FFD700;">Create Account</h2>
    <p style="color:#ccc;">Choose username + password</p>
    <input type="text" name="username" placeholder="Choose username" required style="padding:12px; width:280px; border-radius:8px; border:1px solid #FFD700; background:#222; color:white; margin-bottom:10px;"><br>
    <input type="password" name="password" placeholder="Create password" required style="padding:12px; width:280px; border-radius:8px; border:1px solid #FFD700; background:#222; color:white;"><br><br>
    <button type="submit" style="padding:12px 30px; background:#FFD700; color:black; border:none; border-radius:8px; font-weight:bold; cursor:pointer;">Continue</button>
  </form>
</body></html>
